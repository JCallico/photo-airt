# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false

[advisories]
# Fail on any RustSec vulnerability; unmaintained crates are reported only
# for direct dependencies.
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    # Fonts: egui's bundled fonts and our own assets/fonts.
    "OFL-1.1",
]
# egui's default font set includes the Ubuntu font.
exceptions = [{ crate = "epaint_default_fonts", allow = ["Ubuntu-font-1.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
