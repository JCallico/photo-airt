[package]
name = "photo-airt"
version = "0.6.0"
edition = "2024"
description = "Photo·AIrt — turn your photographs into art with classic algorithms and AI (Claude & Codex CLIs)"
license = "MIT"
authors = ["Javier Callico"]
repository = "https://github.com/JCallico/photo-airt"
readme = "README.md"
keywords = ["image-processing", "art", "egui", "painting", "ai"]
categories = ["multimedia::images", "graphics"]

[dependencies]
# eframe's defaults minus `system_fonts`, and egui's bundled emoji fonts:
# the UI keeps the same fonts and icons on every OS instead of picking up
# system (colour) emoji.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "persistence",
    "wayland",
    "web_screen_reader",
    "wgpu",
    "x11",
] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
# eframe's `winit/default` feature, which a dependency can't enable from
# here: keeps winit's defaults, such as window decorations on GNOME Wayland.
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif", "rayon"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
anyhow = "1"
resvg = "0.49"
dirs = "7"
ureq = "3"
url = "2"
arboard = { version = "3.6", features = ["wayland-data-control"] }
toml = "1"
sha2 = "0.11"
photo-airt-sdk = { path = "sdk", version = "0.6.0" }
# The built-in styles (decision D3), in gallery order. Each is also a
# standalone plug-in executable; see plugins/ and docs/plugins.md.
photo-airt-oil = { path = "plugins/oil", version = "0.6.0" }
photo-airt-brush = { path = "plugins/brush", version = "0.6.0" }
photo-airt-watercolor = { path = "plugins/watercolor", version = "0.6.0" }
photo-airt-pencil = { path = "plugins/pencil", version = "0.6.0" }
photo-airt-ink-toon = { path = "plugins/ink_toon", version = "0.6.0" }
photo-airt-stained-glass = { path = "plugins/stained_glass", version = "0.6.0" }
photo-airt-lowpoly = { path = "plugins/lowpoly", version = "0.6.0" }
photo-airt-halftone = { path = "plugins/halftone", version = "0.6.0" }
photo-airt-pixel = { path = "plugins/pixel", version = "0.6.0" }
photo-airt-scratchboard = { path = "plugins/scratchboard", version = "0.6.0" }

[build-dependencies]
# Embeds the icon in the Windows executable; does nothing for other targets.
embed-resource = "3"

[workspace]
members = ["sdk", "plugins/*"]

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
