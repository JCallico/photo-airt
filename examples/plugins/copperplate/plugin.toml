# Photo·AIrt plug-in manifest: everything the app needs to list, describe and
# run this plug-in. The app reads it without running anything, so users see
# exactly what they are approving.
protocol = 1
id = "copperplate"
name = "Copperplate Engraving"
family = "Plug-in examples"
blurb = "Banknote-style line engraving: tone carved from parallel lines that bend with the image."
technique = "Auto-levelled, tone-modulated line screen: line width follows darkness, line phase is displaced by a softened tone field to sculpt relief, optional cross-hatching in the shadows, anti-aliased against seeded paper grain. A Node.js plug-in using only the standard library."
version = "1.0.0"
author = "Photo·AIrt"
licence = "MIT"
timeout_seconds = 60
run = ["node", "copperplate.mjs"]

[[settings]]
key = "spacing"
label = "Line spacing"
help = "Distance between engraved lines at the reference size (scaled with the image)."
type = "number"
min = 3
max = 16
step = 0.5
default = 6

[[settings]]
key = "angle"
label = "Line angle"
type = "number"
min = 0
max = 180
step = 1
default = 35

[[settings]]
key = "relief"
label = "Relief (line bending)"
type = "number"
min = 0
max = 4
step = 0.05
default = 1.6

[[settings]]
key = "contrast"
label = "Contrast"
type = "number"
min = 0.5
max = 2.5
step = 0.05
default = 1.0

[[settings]]
key = "crosshatch"
label = "Cross-hatch the shadows"
type = "toggle"
default = true

[[settings]]
key = "ink"
label = "Ink"
type = "choice"
default = "black"
options = [
  { value = "black", label = "Black ink on cream" },
  { value = "sepia", label = "Sepia" },
  { value = "banknote", label = "Banknote green" },
  { value = "intaglio-blue", label = "Intaglio blue" },
]
