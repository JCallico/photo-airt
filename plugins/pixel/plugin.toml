# Photo·AIrt plug-in manifest: everything the app needs to list, describe
# and run this style, read without running anything. Built into Photo·AIrt;
# see docs/plugins.md, "Built-in styles are plug-ins too".
protocol = 1
id = "pixel"
name = "Pixel Art"
family = "Print & Pixel"
blurb = "A limited-palette sprite of your photo, 16-bit style."
technique = "Area downsampling, k-means++ palette extraction, ordered Bayer dithering and sprite outlines."
version = "0.2.0"
author = "Photo·AIrt"
licence = "MIT"
run = ["bin/pixel"]
run_windows = ["bin/pixel.exe"]

[[settings]]
key = "size"
label = "Pixel size"
type = "number"
min = 2.0
max = 24.0
step = 1.0
default = 7.0

[[settings]]
key = "colors"
label = "Palette colours"
type = "number"
min = 2.0
max = 32.0
step = 1.0
default = 14.0

[[settings]]
key = "dither"
label = "Dithering"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.45

[[settings]]
key = "outline"
label = "Outlines"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.3

[[settings]]
key = "saturation"
label = "Saturation"
type = "number"
min = 0.6
max = 2.0
step = 0.01
default = 1.2
