# Photo·AIrt plug-in manifest: everything the app needs to list, describe
# and run this style, read without running anything. Built into Photo·AIrt;
# see docs/plugins.md, "Built-in styles are plug-ins too".
protocol = 1
id = "pointillism"
name = "Pointillism"
family = "Painterly"
blurb = "Seurat-style dabs of pure colour that mix in the eye."
technique = "Jittered blue-noise dot placement with divisionist colour splitting and a second fine pass where the photo has detail."
version = "0.2.1"
author = "Photo·AIrt"
licence = "MIT"
run = ["bin/pointillism"]
run_windows = ["bin/pointillism.exe"]

[[settings]]
key = "dot"
label = "Dot size"
type = "number"
min = 2.0
max = 16.0
step = 0.5
default = 6.0

[[settings]]
key = "density"
label = "Density"
type = "number"
min = 0.5
max = 2.0
step = 0.05
default = 1.0

[[settings]]
key = "jitter"
label = "Colour jitter"
type = "number"
min = 0.0
max = 0.3
step = 0.005
default = 0.1

[[settings]]
key = "divisionism"
label = "Divisionism"
type = "number"
min = 0.0
max = 0.6
step = 0.01
default = 0.25

[[settings]]
key = "saturation"
label = "Saturation"
type = "number"
min = 0.8
max = 2.0
step = 0.01
default = 1.35
