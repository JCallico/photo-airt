# Photo·AIrt plug-in manifest: everything the app needs to list, describe
# and run this style, read without running anything. Built into Photo·AIrt;
# see docs/plugins.md, "Built-in styles are plug-ins too".
protocol = 1
id = "pencil"
name = "Graphite Sketch"
family = "Drawing & Ink"
blurb = "Pencil strokes and hatching on paper, matched to the photo's tones."
technique = "Lu, Xu & Jia's pencil drawing (NPAR 2012): gradient strokes classified into eight directions and redrawn as line segments, histogram matching to a three-layer pencil tone model, and flow-aligned hatching texture rendered to that tone."
version = "0.5.1"
author = "Photo·AIrt"
licence = "MIT"
run = ["bin/pencil"]
run_windows = ["bin/pencil.exe"]

[[settings]]
key = "stroke"
label = "Stroke length"
type = "number"
min = 4.0
max = 40.0
step = 1.0
default = 14.0

[[settings]]
key = "darkness"
label = "Line darkness"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.4

[[settings]]
key = "hatching"
label = "Hatching"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.85

[[settings]]
key = "color"
label = "Colour pencil"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.0

[[settings]]
key = "paper"
label = "Paper tooth"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.5
