# Photo·AIrt plug-in manifest: everything the app needs to list, describe
# and run this style, read without running anything. Built into Photo·AIrt;
# see docs/plugins.md, "Built-in styles are plug-ins too".
protocol = 1
id = "stained_glass"
name = "Stained Glass"
family = "Geometric"
blurb = "Leaded glass panes glowing with the colours of your scene."
technique = "Detail-adaptive Voronoi tessellation by jump flooding, per-cell colour averaging, chamfer distance-field lead came and glass texture."
version = "0.2.0"
author = "Photo·AIrt"
licence = "MIT"
run = ["bin/stained_glass"]
run_windows = ["bin/stained_glass.exe"]

[[settings]]
key = "cell"
label = "Pane size"
type = "number"
min = 8.0
max = 90.0
step = 1.0
default = 30.0

[[settings]]
key = "adaptivity"
label = "Detail adaptivity"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.6

[[settings]]
key = "lead"
label = "Lead width"
type = "number"
min = 0.5
max = 6.0
step = 0.1
default = 2.2

[[settings]]
key = "glow"
label = "Glow"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.45

[[settings]]
key = "texture"
label = "Glass texture"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.5
