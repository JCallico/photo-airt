# Photo·AIrt plug-in manifest: everything the app needs to list, describe
# and run this style, read without running anything. Built into Photo·AIrt;
# see docs/plugins.md, "Built-in styles are plug-ins too".
protocol = 1
id = "ink_toon"
name = "Ink & Toon"
family = "Drawing & Ink"
blurb = "Clean shapes and bold outlines, from a sepia ink wash to a cel-shaded frame."
technique = "Anisotropic Kuwahara abstraction, Winnemöller's eXtended Difference-of-Gaussians outlines and soft tone banding, blended from a contrast-stretched ink wash to HSV cel shading."
version = "0.5.2"
author = "Photo·AIrt"
licence = "MIT"
run = ["bin/ink_toon"]
run_windows = ["bin/ink_toon.exe"]

[[settings]]
key = "colour"
label = "Colour (0 = ink wash)"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 1.0

[[settings]]
key = "smoothing"
label = "Smoothing"
type = "number"
min = 1.0
max = 8.0
step = 0.5
default = 4.0

[[settings]]
key = "levels"
label = "Shade levels"
type = "number"
min = 2.0
max = 10.0
step = 1.0
default = 5.0

[[settings]]
key = "outline"
label = "Outline"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.7

[[settings]]
key = "detail"
label = "Line detail (σ)"
type = "number"
min = 0.6
max = 4.0
step = 0.05
default = 1.3

[[settings]]
key = "sepia"
label = "Sepia paper"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.5
