# Photo·AIrt plug-in manifest: everything the app needs to list, describe
# and run this style, read without running anything. Built into Photo·AIrt;
# see docs/plugins.md, "Built-in styles are plug-ins too".
protocol = 1
id = "scratchboard"
name = "Scratchboard"
family = "Drawing & Ink"
blurb = "Light scratched out of night-dark ink, with a glowing sun and stars."
technique = "Night tone mapping that turns blue skies and water to ink while other colours keep their brightness, local contrast, flow-aligned scratch strokes thresholded against the tone, XDoG ink contours, radial sun rays and a navy-to-cream ink ramp."
version = "0.6.1"
author = "Photo·AIrt"
licence = "MIT"
run = ["bin/scratchboard"]
run_windows = ["bin/scratchboard.exe"]

[[settings]]
key = "night"
label = "Night sky"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 1.0

[[settings]]
key = "detail"
label = "Shadow detail"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.3

[[settings]]
key = "scratch"
label = "Scratch size"
type = "number"
min = 0.5
max = 4.0
step = 0.1
default = 2.0

[[settings]]
key = "texture"
label = "Scratch texture"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.6

[[settings]]
key = "lines"
label = "Ink contours"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.5

[[settings]]
key = "rays"
label = "Sun rays & stars"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.6

[[settings]]
key = "tint"
label = "Ink tint"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 1.0
