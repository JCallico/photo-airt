# Photo·AIrt plug-in manifest: everything the app needs to list, describe
# and run this style, read without running anything. Built into Photo·AIrt;
# see docs/plugins.md, "Built-in styles are plug-ins too".
protocol = 1
id = "toon"
name = "Cel Animation"
family = "Drawing & Ink"
blurb = "Flat shading bands and bold outlines, like a hand-inked frame."
technique = "Edge-preserving abstraction, HSV value quantisation with soft steps and XDoG outlines."
version = "0.2.1"
author = "Photo·AIrt"
licence = "MIT"
run = ["bin/toon"]
run_windows = ["bin/toon.exe"]

[[settings]]
key = "smoothing"
label = "Smoothing"
type = "number"
min = 1.0
max = 8.0
step = 0.5
default = 4.0

[[settings]]
key = "levels"
label = "Shade levels"
type = "number"
min = 2.0
max = 10.0
step = 1.0
default = 5.0

[[settings]]
key = "outline"
label = "Outline"
type = "number"
min = 0.0
max = 1.0
step = 0.01
default = 0.7

[[settings]]
key = "saturation"
label = "Saturation"
type = "number"
min = 0.6
max = 2.0
step = 0.01
default = 1.35
